services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: admitgraph
      POSTGRES_USER: admitgraph
      POSTGRES_PASSWORD: admitgraph_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admitgraph"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://admitgraph:admitgraph_dev_password@postgres:5432/admitgraph
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      APP_ENV: development
      LOG_LEVEL: INFO
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ../frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
