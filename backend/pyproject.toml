[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admitgraph-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # fastapi/pydantic/sqlalchemy/alembic are PINNED: they author the derived
    # artefacts (api/openapi.json, database/schema.sql) and CI regenerates +
    # diffs them. A floating minor here (pydantic 2.14 changed Decimal's JSON
    # schema) turns into a red "stale artefact" check the moment a new version
    # ships. Bump deliberately, then re-run scripts/export_openapi and
    # scripts/export_schema and commit the regenerated files with it.
    "fastapi==0.142.2",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]==2.1.3",
    "psycopg[binary]>=3.2",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "redis>=5.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "reportlab>=4.0",
    "argon2-cffi>=2.3",
    "PyJWT>=2.8",
    "asyncpg>=0.30",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    # Pinned so a new ruff/mypy/pytest release can't flip CI red on code that
    # passed locally the day it was written (same reason as the runtime pins).
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage is intentionally NOT in addopts (keeps `pytest -q` fast and
# plugin-optional). Run:  pytest -q --cov=app --cov-report=term-missing
# CI reports the number; no threshold is enforced (see .github/workflows/ci.yml).

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
