name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admitgraph
          POSTGRES_PASSWORD: admitgraph_dev_password
          POSTGRES_DB: admitgraph
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGRAPH_TEST_DATABASE_URL: postgresql+asyncpg://admitgraph:admitgraph_dev_password@localhost:5433/admitgraph_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: ruff check app tests scripts
        working-directory: backend
      - run: mypy app
        working-directory: backend
      # P1-12: api/openapi.json is a derived artefact — regenerate it from the
      # app and fail if it drifted (mirrors the schema.sql check below; no DB
      # needed, so it runs before pytest).
      - name: api/openapi.json matches the FastAPI app (regenerate + diff)
        run: |
          python -m scripts.export_openapi --output "$RUNNER_TEMP/openapi_ci.json"
          if ! diff -u ../api/openapi.json "$RUNNER_TEMP/openapi_ci.json"; then
            echo "::error file=api/openapi.json::api/openapi.json is stale — regenerate it with: cd backend && python -m scripts.export_openapi"
            exit 1
          fi
        working-directory: backend
      # The suite includes the frontend source scan (tests/test_frontend_secrets.py)
      # and the path-extraction contract test (tests/test_contract.py); coverage is
      # REPORTED only — no threshold is enforced yet (W6).
      - name: pytest (580 tests, coverage reported)
        run: pytest -q --cov=app --cov-report=term-missing
        working-directory: backend
      # Named step so a secrets/contract regression is obvious in the checks UI
      # (the same tests already ran above — cheap, no DB needed).
      - name: secrets scan + API path contract
        run: pytest -q tests/test_frontend_secrets.py tests/test_contract.py
        working-directory: backend
      # P1-6: database/schema.sql is a derived artefact and must never diverge
      # from the Alembic history. Regenerate from a freshly-migrated database
      # and diff. The per-run pg_dump `\restrict` token and the machine-specific
      # "Regenerate:" hint line are normalised away; pg_dump runs inside the
      # same postgres:16 image as the service so the dump format matches.
      - name: database/schema.sql matches Alembic (regenerate + diff)
        run: |
          python -m scripts.export_schema --url "$DATABASE_URL" --output "$RUNNER_TEMP/schema_ci.sql" \
            --pg-dump-cmd "docker run --rm --network host -e PGPASSWORD=admitgraph_dev_password postgres:16 pg_dump -h localhost -p 5433 -U admitgraph -d admitgraph"
          strip() { grep -vE '^\\(restrict|unrestrict) |^-- Regenerate:' "$1"; }
          if ! diff -u <(strip "$RUNNER_TEMP/schema_ci.sql") <(strip ../database/schema.sql); then
            echo "::error file=database/schema.sql::database/schema.sql is stale — regenerate it with: cd backend && python -m scripts.export_schema --url <scratch-db-url>"
            exit 1
          fi
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://admitgraph:admitgraph_dev_password@localhost:5433/admitgraph

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 = the version this project is developed and verified on (also
          # the version undici 8 / jsdom require: worker_threads.markAsUncloneable
          # does not exist on Node 20, and jsdom's fetch shim crashes without it).
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      # P1-12: app/lib/api-types.generated.ts is generated from ../api/openapi.json
      # — regenerate and fail on drift so a backend route rename can't silently
      # desynchronise the client's types. `git diff` catches a modified file;
      # an untracked one (never committed) is caught by `git status`.
      - name: api-types.generated.ts matches api/openapi.json (regenerate + diff)
        run: |
          npm run gen:api-types
          if ! git diff --exit-code -- app/lib/api-types.generated.ts || \
             [ -n "$(git status --porcelain -- app/lib/api-types.generated.ts)" ]; then
            echo "::error file=frontend/app/lib/api-types.generated.ts::generated API types are stale — run: cd frontend && npm run gen:api-types"
            exit 1
          fi
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # `next build` generates next-env.d.ts, which is gitignored — the type
      # check must run AFTER the build (or dev), otherwise tsc fails on the
      # missing Next.js type references (the old lint → tsc → build order was
      # a guaranteed red check on a fresh checkout).
      - run: npm run build
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose interpolates services.*.environment even for `build`, and
      # JWT_SECRET is deliberately required (fail closed, no default) — so CI
      # supplies an obvious build-only placeholder. It never runs the image;
      # real deployments must set their own secret.
      - run: docker compose -f deployment/docker-compose.yml build
        env:
          JWT_SECRET: ci-build-placeholder-not-used-at-runtime
